name: Red team scan status

# The cheap half of the scan: one API call, no model calls, runs on every push.
#
# It reports whether *this* revision has been scanned rather than re-scanning it.
# Evidence recorded by `redteam-scan.yml` (or by a local run publishing through
# `pnpm redteam:publish`) is bound to a commit; if it matches, the stored
# conclusion is republished and nothing expensive happens. If it does not, the
# check says the revision is unscanned and how to ask for one.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: redteam-status-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  status:
    name: Red team scan status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
      pull-requests: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          sparse-checkout: redteam
          sparse-checkout-cone-mode: false

      - name: Install Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Report whether this revision has been scanned
        run: node redteam/check-evidence.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
